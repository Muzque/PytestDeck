[project]
name = "pytestdeck"
version = "0.1.0"
description = "Lightweight cross-project Python test control deck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "pytest-json-report>=1.5.0",
    "behave>=1.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "ASYNC230",
    "S110"
]
