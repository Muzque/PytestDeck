<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Python Blue Gradient -->
    <linearGradient id="pyBlueKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8BBE"/>
      <stop offset="100%" stop-color="#306998"/>
    </linearGradient>

    <!-- Python Yellow Gradient -->
    <linearGradient id="pyYellowKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>

    <!-- Base Deck Chassis -->
    <linearGradient id="deckChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Outer Deck Chassis (Rounded Hardware Bezel) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#deckChassis)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#334155" stroke-width="2"/>

  <!-- KEY 1 (Top-Left): Active Python Blue Test Runner Key -->
  <g>
    <!-- Key Base -->
    <rect x="9" y="9" width="21" height="21" rx="5" fill="url(#pyBlueKey)"/>
    <rect x="9" y="9" width="21" height="21" rx="5" stroke="#60A5FA" stroke-width="1.2" opacity="0.6"/>
    <!-- Terminal Prompt Icon (Play / Command >) -->
    <path d="M16 15 L22 19.5 L16 24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- KEY 2 (Top-Right): Dark Standby Key -->
  <g opacity="0.85">
    <rect x="34" y="9" width="21" height="21" rx="5" fill="#1E2638" stroke="#334155" stroke-width="1.2"/>
    <!-- Status Dots -->
    <circle cx="41.5" cy="19.5" r="1.8" fill="#64748B"/>
    <circle cx="47.5" cy="19.5" r="1.8" fill="#64748B"/>
  </g>

  <!-- KEY 3 (Bottom-Left): Dark Standby Key with Terminal Dash -->
  <g opacity="0.85">
    <rect x="9" y="34" width="21" height="21" rx="5" fill="#1E2638" stroke="#334155" stroke-width="1.2"/>
    <!-- Mini Log Wave / Pulse Lines -->
    <rect x="14" y="42" width="11" height="2" rx="1" fill="#64748B"/>
    <rect x="14" y="47" width="7" height="2" rx="1" fill="#475569"/>
  </g>

  <!-- KEY 4 (Bottom-Right): Active Python Yellow Passing / Check Key -->
  <g>
    <!-- Key Base -->
    <rect x="34" y="34" width="21" height="21" rx="5" fill="url(#pyYellowKey)"/>
    <rect x="34" y="34" width="21" height="21" rx="5" stroke="#FEF08A" stroke-width="1.2" opacity="0.8"/>
    <!-- Bold Passing Checkmark -->
    <path d="M40 44.5 L43.5 48 L49.5 39.5" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
