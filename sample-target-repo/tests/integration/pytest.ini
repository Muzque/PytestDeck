[pytest]
pythonpath = ../../src src
testpaths = .
addopts = -n 2 -s
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-10s - %(message)s
log_cli_date_format = %H:%M:%S
markers =
    slow: marks tests as slow or long-running
    smoke: quick verification tests
    regression: regression test suite
    api_mark: API integration verification tests

